# Test profile — uses H2 in-memory, no DevTools, minimal logging
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.com.example.ebookstore=WARN
logging.level.org.springframework.security=WARN

# JWT (short expiry fine for tests)
app.jwt.secret=3f8b2c1a9d4e7f0b6c5a2d8e1f4b7c0a3d6e9f2b5c8a1d4e7f0b3c6a9d2e5f8
app.jwt.expiration-ms=3600000

# Disable DataSeeder during tests — tests build their own fixtures
spring.autoconfigure.exclude=
