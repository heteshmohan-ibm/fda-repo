# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL profile  –  activate with:  --spring.profiles.active=postgres
# Set the four env-vars below (or override directly) before starting the app.
# ─────────────────────────────────────────────────────────────────────────────

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookstore}
spring.datasource.username=${DB_USERNAME:ebookstore}
spring.datasource.password=${DB_PASSWORD:ebookstore}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; tune if needed)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' in production — run Flyway/Liquibase for schema migrations.
# Use 'update' for initial dev convenience on a real PG instance.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 console must be disabled when using PostgreSQL
spring.h2.console.enabled=false
