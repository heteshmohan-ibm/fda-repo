# Server
server.port=8080
spring.application.name=ebookstore

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:ebookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console  →  http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.com.example.ebookstore=DEBUG
logging.level.org.springframework.web=INFO

# JWT
app.jwt.secret=3f8b2c1a9d4e7f0b6c5a2d8e1f4b7c0a3d6e9f2b5c8a1d4e7f0b3c6a9d2e5f8
app.jwt.expiration-ms=86400000
